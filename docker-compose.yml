services:
  # Serviço da aplicação Laravel
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: mapaobrasv2_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - mapaobrasv2_network
    depends_on:
      - postgres
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=mapaobrasv2
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres

  # Serviço do Nginx
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: mapaobrasv2_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - mapaobrasv2_network
    depends_on:
      - app

  # Serviço do PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: mapaobrasv2_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mapaobrasv2
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - mapaobrasv2_network

  # Serviço do Redis (opcional, para cache e sessões)
  redis:
    image: redis:7-alpine
    container_name: mapaobrasv2_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - mapaobrasv2_network

  # Serviço do Adminer (interface web para PostgreSQL)
  adminer:
    image: adminer:4.8.1
    container_name: mapaobrasv2_adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    networks:
      - mapaobrasv2_network
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local

networks:
  mapaobrasv2_network:
    driver: bridge
